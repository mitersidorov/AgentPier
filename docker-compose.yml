services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3101}:80"
    depends_on:
      - manager
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-local-agentpier}
      MYSQL_DATABASE: ${DB_NAME:-agentpier}
      MYSQL_USER: ${DB_USER:-agentpier}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-agentpier}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-local-agentpier}"]
      interval: 5s
      timeout: 5s
      retries: 20
  manager:
    build:
      context: .
      dockerfile: apps/manager/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_USER: ${DB_USER:-agentpier}
      DB_PASSWORD: ${DB_PASSWORD:-local-agentpier}
      DB_NAME: ${DB_NAME:-agentpier}
      DB_HOST: mysql
      DB_PORT: 3306
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-agentpier-backups}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PREFIX: ${S3_PREFIX:-agentpier/}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-5}
      RESTORE_TEST_DB: ${RESTORE_TEST_DB:-agentpier_restore_test}
      CODEX_APP_SERVER_URL: ws://host.docker.internal:4500
    ports:
      - "127.0.0.1:${MANAGER_PORT:-3100}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
