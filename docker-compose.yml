services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-local-agentpier}
      MYSQL_DATABASE: ${DB_NAME:-agentpier}
      MYSQL_USER: ${DB_USER:-agentpier}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-agentpier}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-local-agentpier}"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-agentpierlocal}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-agentpier-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
  create-bucket:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: ["for i in $(seq 1 30); do aws s3api create-bucket --bucket $${S3_BUCKET:-agentpier-backups} --endpoint-url http://minio:9000 2>/dev/null && exit 0; aws s3api head-bucket --bucket $${S3_BUCKET:-agentpier-backups} --endpoint-url http://minio:9000 2>/dev/null && exit 0; sleep 2; done; exit 1"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-agentpierlocal}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-agentpier-secret}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-agentpierlocal}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-agentpier-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-agentpier-backups}
  manager:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_USER: ${DB_USER:-agentpier}
      DB_PASSWORD: ${DB_PASSWORD:-local-agentpier}
      DB_NAME: ${DB_NAME:-agentpier}
      DB_HOST: mysql
      DB_PORT: 3306
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-agentpierlocal}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-agentpier-secret}
      S3_BUCKET: ${S3_BUCKET:-agentpier-backups}
      S3_FORCE_PATH_STYLE: "true"
      CODEX_APP_SERVER_URL: ws://host.docker.internal:4500
    ports:
      - "${MANAGER_PORT:-3100}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
volumes:
  mysql_data:
  minio_data:
